# La landing, en el nginx que ya atiende los 80 y 443 del VPS. Va en
# /etc/nginx/sites-enabled/; el certificado lo agrega certbot sobre este archivo.
# Los archivos salen de `pnpm --filter @gpb/landing publicable`, copiados a /var/www/garageproboard/landing.

server {
    listen 80;
    server_name www.garageproboard.com garageproboard.com.ar www.garageproboard.com.ar;
    return 301 https://garageproboard.com$request_uri;
}

server {
    listen 80;
    server_name garageproboard.com;

    root /var/www/garageproboard/landing;
    index index.html;
    error_page 404 /404.html;

    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    location / {
        try_files $uri $uri.html $uri/ =404;
    }

    # El formulario de contacto. Sólo esta ruta: el resto de la API no se publica por acá.
    location = /api/publico/contacto {
        proxy_pass http://127.0.0.1:3081;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
}
