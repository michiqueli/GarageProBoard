# Postgres va al 5433 a proposito: el 5432 lo ocupa el PostgreSQL 18 nativo de
# Windows, y su psql nos sirve igual como cliente de linea de comandos.
name: gpb

services:
  postgres:
    image: postgres:18-alpine
    container_name: gpb-pg
    restart: unless-stopped
    ports:
      - "5433:5432"
    environment:
      POSTGRES_USER: gpb
      POSTGRES_PASSWORD: gpb_dev
      POSTGRES_DB: gpb
      # Colación ICU es-AR: sin esto, ordenar razones sociales pone "Ñandú" después
      # de "Zapata" y el listado de clientes queda raro a la vista del usuario.
      POSTGRES_INITDB_ARGS: "--encoding=UTF8 --locale-provider=icu --icu-locale=es-AR"
      TZ: America/Argentina/Buenos_Aires
    volumes:
      # PG18 cambió el punto de montaje recomendado: un solo mount acá arriba deja
      # los datos en un subdirectorio y habilita pg_upgrade --link a futuro.
      - pgdata:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U gpb -d gpb"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:8-alpine
    container_name: gpb-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    # appendonly para que los trabajos encolados sobrevivan un reinicio:
    # un reintento de facturacion perdido es una factura que no se emite.
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  # Los archivos que guarda el sistema: hoy las imágenes de la hoja de recepción, mañana las
  # fotos del vehículo y el logo de la concesionaria.
  #
  # Es Garage y no MinIO porque al 29/09/2026 `minio/minio` ya no está publicada en Docker Hub
  # y `quay.io` contesta 401. A la API le da igual: habla S3 con los dos.
  #
  # Un bucket no tiene RLS: el aislamiento entre concesionarias es el prefijo `t/<tenant>/` de
  # la clave, que pone `ArchivosDelTenant` con el tenant de la sesión. Ver
  # docs/tecnicos/hoja-de-recepcion.md.
  #
  # Recién creado no sirve para nada: hay que darle su layout, su clave y su bucket. Eso lo
  # hace `pnpm infra:s3`, que es idempotente.
  garage:
    image: dxflrs/garage:v2.4.1
    container_name: gpb-garage
    restart: unless-stopped
    ports:
      - "3900:3900"
      - "3903:3903"
    environment:
      # El config viene montado desde el repo, con los permisos que tenga el sistema de
      # archivos del que clona: sin esto, Garage se niega a arrancar por el rpc_secret.
      GARAGE_ALLOW_WORLD_READABLE_SECRETS: "true"
    volumes:
      - ./garage.toml:/etc/garage.toml:ro
      - garagedata:/var/lib/garage
    healthcheck:
      test: ["CMD", "/garage", "status"]
      interval: 5s
      timeout: 5s
      retries: 10

  # Garage no trae consola web: viene con un CLI y una API de administración. Esta es la
  # interfaz de la comunidad, para mirar los buckets y los archivos con los ojos —lo que MinIO
  # daba de fábrica—. En http://localhost:3909, y es sólo de desarrollo.
  garage-webui:
    image: khairul169/garage-webui:1.1.0
    container_name: gpb-garage-webui
    restart: unless-stopped
    depends_on:
      - garage
    ports:
      - "3909:3909"
    environment:
      API_BASE_URL: "http://garage:3903"
      S3_ENDPOINT_URL: "http://garage:3900"
      API_ADMIN_KEY: "gpb_dev_admin"
    volumes:
      - ./garage.toml:/etc/garage.toml:ro

  # Atrapa los mails que manda el sistema en desarrollo: nada le llega a nadie de verdad, y
  # se ven en http://localhost:8025 con sus adjuntos.
  mailpit:
    image: axllent/mailpit:latest
    container_name: gpb-mailpit
    restart: unless-stopped
    ports:
      - "1025:1025"
      - "8025:8025"

volumes:
  pgdata:
  redisdata:
  garagedata:
