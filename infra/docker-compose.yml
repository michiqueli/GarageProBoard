# Postgres va al 5433 a proposito: el 5432 lo ocupa el PostgreSQL 18 nativo de
# Windows, y su psql nos sirve igual como cliente de linea de comandos.
name: garagepro

services:
  postgres:
    image: postgres:18-alpine
    container_name: garagepro-pg
    restart: unless-stopped
    ports:
      - "5433:5432"
    environment:
      POSTGRES_USER: garagepro
      POSTGRES_PASSWORD: garagepro_dev
      POSTGRES_DB: garagepro
      # Colación ICU es-AR: sin esto, ordenar razones sociales pone "Ñandú" después
      # de "Zapata" y el listado de clientes queda raro a la vista del usuario.
      POSTGRES_INITDB_ARGS: "--encoding=UTF8 --locale-provider=icu --icu-locale=es-AR"
      TZ: America/Argentina/Buenos_Aires
    volumes:
      # PG18 cambió el punto de montaje recomendado: un solo mount acá arriba deja
      # los datos en un subdirectorio y habilita pg_upgrade --link a futuro.
      - pgdata:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U garagepro -d garagepro"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:8-alpine
    container_name: garagepro-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    # appendonly para que los trabajos encolados sobrevivan un reinicio:
    # un reintento de facturacion perdido es una factura que no se emite.
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  pgdata:
  redisdata:
